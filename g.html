<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Reader</title>
    <style>
        /* Reset margins and padding to ensure a full-screen experience */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #333; /* Dark background to make the white PDF pop */
            overflow: hidden; /* Hides the website's scrollbar so only the PDF scrolls */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container to hold the iframe */
        .pdf-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Iframe styling for a seamless look */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <!-- Google Drive Embed with the /preview tag -->
        <iframe 
            src="https://drive.google.com/file/d/1iLYBo1YToYSTlSqt8cYDyIwOk0V9yZbt/preview" 
            allow="autoplay"
            title="PDF Document Viewer">
        </iframe>
    </div>

</body>
</html>
