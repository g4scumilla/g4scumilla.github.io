<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical PDF Reader Pro</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a 50%, #020617);
            --glass-bg: rgba(30, 41, 59, 0.82);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --viewer-width: 92%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ================= TOP COLLAPSIBLE CONTROL BAR ================= */
        .top-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90px;
            opacity: 1;
            gap: 12px;
        }

        .top-toolbar.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom: none;
            opacity: 0;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }

        /* Quick Link Input Bar in Header */
        .quick-input-bar {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 4px 4px 4px 12px;
            flex: 1;
            max-width: 420px;
            transition: border-color 0.2s;
        }

        .quick-input-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
        }

        .quick-input-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.82rem;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .quick-input-bar input::placeholder {
            color: var(--text-muted);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn.active, .btn-primary {
            background: var(--accent);
            border-color: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.78rem;
            border-radius: 7px;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--glass-border);
            margin: 0 2px;
        }

        /* Floating Expand/Collapse Pill Button */
        .toolbar-toggle-pill {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            z-index: 150;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toolbar-toggle-pill.visible {
            transform: translateX(-50%) translateY(0);
        }

        .toolbar-toggle-pill:hover {
            background: var(--accent);
        }

        /* ================= MAIN CONTENT AREA ================= */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: padding 0.3s ease;
        }

        .workspace.edge-to-edge {
            padding: 0;
        }

        .pdf-card {
            width: var(--viewer-width);
            height: 100%;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .workspace.edge-to-edge .pdf-card {
            width: 100% !important;
            border-radius: 0;
            border: none;
        }

        .pdf-card.minimized {
            height: 48px !important;
            width: 480px !important;
            border-radius: 14px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .window-dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .dot:hover { transform: scale(1.2); }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: #10b981; }
        .dot.purple { background: #6366f1; }

        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #0f172a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            transition: filter 0.25s ease, transform 0.35s ease;
        }

        /* Loading Spinner */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ================= COLLAPSIBLE SIDE DRAWERS ================= */
        .side-drawer {
            position: fixed;
            top: 72px;
            right: 20px;
            width: 350px;
            max-height: calc(100vh - 95px);
            overflow-y: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            z-index: 120;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .side-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .text-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 9px 12px;
            font-size: 0.83rem;
            font-family: inherit;
            outline: none;
        }

        .text-input:focus {
            border-color: var(--accent);
        }

        /* Saved PDF Library List */
        .saved-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .saved-item:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(30, 41, 59, 0.9);
        }

        .saved-item.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
        }

        .saved-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            flex: 1;
            margin-right: 8px;
        }

        .saved-item-title {
            font-size: 0.83rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-item-id {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .saved-item-actions {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.15);
        }

        .icon-btn.delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
        }

        .control-row {
            margin-bottom: 15px;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .notes-area {
            width: 100%;
            height: 220px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            resize: none;
            outline: none;
            margin-bottom: 12px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: #fff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 200;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 950px) {
            .quick-input-bar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .top-toolbar {
                padding: 10px 12px;
                flex-direction: column;
                max-height: 150px;
            }
            .workspace {
                padding: 6px;
            }
            :root {
                --viewer-width: 100%;
            }
            .btn span {
                display: none;
            }
            .side-drawer {
                width: calc(100vw - 24px);
                right: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Pill to Expand Toolbar When Collapsed -->
    <button class="toolbar-toggle-pill" id="expandToolbarBtn" onclick="toggleToolbar()">
        <i class="fa-solid fa-sliders"></i> Show Controls
    </button>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">PDF Saved Permanently!</span>
    </div>

    <div class="app-wrapper">
        <!-- Collapsible Top Control Bar -->
        <header class="top-toolbar" id="topToolbar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <div>
                    <div>PDF Studio Pro</div>
                    <small style="color: var(--text-muted); font-size: 0.72rem;" id="activeDocSub">Permanent Reader</small>
                </div>
            </div>

            <!-- Instant Link Paste Bar -->
            <div class="quick-input-bar">
                <i class="fa-solid fa-link" style="color: var(--accent-hover); margin-right: 8px;"></i>
                <input type="text" id="quickUrlInput" placeholder="Paste PDF link & press Save..." onkeydown="if(event.key==='Enter') saveQuickLink()">
                <button class="btn btn-primary btn-sm" onclick="saveQuickLink()">
                    <i class="fa-solid fa-floppy-disk"></i> Save & Preview
                </button>
            </div>

            <div class="controls-group">
                <!-- Saved PDF Library & Link Manager Drawer -->
                <button class="btn btn-primary" onclick="toggleDrawer('libraryDrawer')" id="libraryBtn" title="Add or Switch Saved PDFs">
                    <i class="fa-solid fa-folder-plus"></i> <span>Saved PDFs</span>
                </button>

                <div class="divider"></div>

                <!-- Collapse/Expand PDF Card -->
                <button class="btn" onclick="toggleMinimizePDF()" id="minimizeBtn" title="Collapse or Expand PDF Viewer">
                    <i class="fa-solid fa-compress"></i> <span>Collapse</span>
                </button>

                <!-- Width / Cinema Toggle -->
                <button class="btn" onclick="toggleEdgeToEdge()" id="edgeBtn" title="Toggle Cinema Full-Width">
                    <i class="fa-solid fa-arrows-left-right"></i> <span>Cinema</span>
                </button>

                <!-- Rotate Page -->
                <button class="btn" onclick="rotatePDF()" title="Rotate Viewer 90°">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>

                <!-- Eye Care & Display Controls Drawer -->
                <button class="btn" onclick="toggleDrawer('displayDrawer')" id="displayBtn" title="Eye Care & Zoom Controls">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Filters</span>
                </button>

                <!-- Quick Notes Drawer -->
                <button class="btn" onclick="toggleDrawer('notesDrawer')" id="notesBtn" title="Take Reading Notes">
                    <i class="fa-solid fa-pen-to-square"></i> <span>Notes</span>
                </button>

                <!-- Direct Download -->
                <a class="btn" id="downloadBtn"
                   href="https://drive.google.com/uc?export=download&id=1iLYBo1YToYSTlSqt8cYDyIwOk0V9yZbt" 
                   target="_blank" 
                   title="Download Current PDF">
                    <i class="fa-solid fa-download"></i>
                </a>

                <!-- Fullscreen -->
                <button class="btn" onclick="toggleFullScreen()" title="Fullscreen Mode">
                    <i class="fa-solid fa-expand" id="fsIcon"></i>
                </button>

                <!-- Collapse Top Bar -->
                <button class="btn" onclick="toggleToolbar()" title="Hide Toolbar">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="workspace" id="workspace">
            <div class="pdf-card" id="pdfCard">
                <!-- Mini Window Header (Open in Drive removed) -->
                <div class="card-header">
                    <div class="window-dots">
                        <div class="dot yellow" onclick="toggleMinimizePDF()" title="Collapse/Expand PDF"></div>
                        <div class="dot green" onclick="toggleEdgeToEdge()" title="Expand Width"></div>
                        <div class="dot purple" onclick="toggleToolbar()" title="Toggle Top Controls"></div>
                        <span id="docTitleDisplay" style="margin-left: 8px; font-weight: 600; color: #e2e8f0;">Default Document</span>
                    </div>
                </div>

                <!-- PDF Embed Container -->
                <div class="iframe-wrapper">
                    <div class="loader-overlay" id="loader">
                        <div class="spinner"></div>
                        <span style="font-size: 0.9rem; color: var(--text-muted);">Loading your PDF preview...</span>
                    </div>

                    <iframe 
                        id="pdfFrame"
                        src="https://drive.google.com/file/d/1iLYBo1YToYSTlSqt8cYDyIwOk0V9yZbt/preview" 
                        allow="autoplay"
                        onload="hideLoader()"
                        title="PDF Document Viewer">
                    </iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= 1. PERMANENT PDF LIBRARY & LINK INPUT DRAWER ================= -->
    <aside class="side-drawer" id="libraryDrawer">
        <div class="drawer-header">
            <span><i class="fa-solid fa-bookmark" style="color: var(--accent);"></i> Add & Save PDF Link</span>
            <button class="btn btn-sm" onclick="toggleDrawer('libraryDrawer')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="input-group">
            <label>PDF Name / Title (Optional)</label>
            <input type="text" class="text-input" id="pdfTitleInput" placeholder="e.g., Chapter 1 Study Guide">
        </div>

        <div class="input-group">
            <label>PDF Link (or File ID)</label>
            <input type="text" class="text-input" id="pdfUrlInput" placeholder="https://drive.google.com/file/d/.../view">
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 16px;" onclick="addAndSavePDF()">
            <i class="fa-solid fa-floppy-disk"></i> Preview & Save Permanently
        </button>

        <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); padding-bottom: 6px;">
            Permanently Saved PDFs (<span id="savedCount">1</span>)
        </div>

        <div class="saved-list" id="savedListContainer">
            <!-- Dynamically populated by JavaScript -->
        </div>
    </aside>

    <!-- ================= 2. DISPLAY & EYE-CARE DRAWER ================= -->
    <aside class="side-drawer" id="displayDrawer">
        <div class="drawer-header">
            <span><i class="fa-solid fa-sliders" style="color: var(--accent);"></i> Reading Comfort Controls</span>
            <button class="btn btn-sm" onclick="toggleDrawer('displayDrawer')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="control-row">
            <label><span>Container Width</span> <span id="widthVal">92%</span></label>
            <input type="range" min="50" max="100" value="92" oninput="updateWidth(this.value)">
        </div>

        <div class="control-row">
            <label><span>Brightness</span> <span id="brightVal">100%</span></label>
            <input type="range" id="brightSlider" min="50" max="130" value="100" oninput="applyFilters()">
        </div>

        <div class="control-row">
            <label><span>Contrast</span> <span id="contrastVal">100%</span></label>
            <input type="range" id="contrastSlider" min="70" max="150" value="100" oninput="applyFilters()">
        </div>

        <div class="control-row">
            <label><span>Warm Sepia (Eye Care)</span> <span id="sepiaVal">0%</span></label>
            <input type="range" id="sepiaSlider" min="0" max="80" value="0" oninput="applyFilters()">
        </div>

        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="btn" style="flex: 1; justify-content: center;" onclick="toggleInvert()">
                <i class="fa-solid fa-moon"></i> Invert Dark
            </button>
            <button class="btn" style="flex: 1; justify-content: center;" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
        </div>
    </aside>

    <!-- ================= 3. QUICK NOTES DRAWER ================= -->
    <aside class="side-drawer" id="notesDrawer">
        <div class="drawer-header">
            <span><i class="fa-solid fa-pen-nib" style="color: var(--accent);"></i> Quick Reading Notes</span>
            <button class="btn btn-sm" onclick="toggleDrawer('notesDrawer')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <textarea class="notes-area" id="notesInput" placeholder="Write key takeaways while reading... (Auto-saved permanently in browser)"></textarea>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-primary" style="flex: 1; justify-content: center;" onclick="downloadNotes()">
                <i class="fa-solid fa-file-arrow-down"></i> Save .txt
            </button>
            <button class="btn" onclick="clearNotes()" title="Clear Notes">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
    </aside>

    <script>
        const DEFAULT_FILE_ID = '1iLYBo1YToYSTlSqt8cYDyIwOk0V9yZbt';
        const STORAGE_KEY_LIST = 'magical_pdf_saved_library_v1';
        const STORAGE_KEY_ACTIVE = 'magical_pdf_active_id_v1';

        const pdfFrame = document.getElementById('pdfFrame');
        const pdfCard = document.getElementById('pdfCard');
        const topToolbar = document.getElementById('topToolbar');
        const expandToolbarBtn = document.getElementById('expandToolbarBtn');
        const workspace = document.getElementById('workspace');
        const notesInput = document.getElementById('notesInput');

        let currentRotation = 0;
        let isInverted = false;
        let savedLibrary = [];
        let activeFileId = DEFAULT_FILE_ID;

        // ================= INITIALIZE & LOAD PERMANENT SAVED STATE =================
        window.addEventListener('DOMContentLoaded', () => {
            const storedList = localStorage.getItem(STORAGE_KEY_LIST);
            if (storedList) {
                try {
                    savedLibrary = JSON.parse(storedList);
                } catch (e) {
                    savedLibrary = [];
                }
            }

            if (savedLibrary.length === 0) {
                savedLibrary = [{
                    id: DEFAULT_FILE_ID,
                    title: 'Primary Document',
                    addedAt: new Date().toLocaleDateString()
                }];
                localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(savedLibrary));
            }

            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');
            const storedActiveId = localStorage.getItem(STORAGE_KEY_ACTIVE);

            if (paramId) {
                const extracted = extractDriveId(paramId);
                if (extracted) {
                    activeFileId = extracted;
                    ensureInLibrary(activeFileId, 'Shared Document');
                }
            } else if (storedActiveId) {
                activeFileId = storedActiveId;
            } else {
                activeFileId = savedLibrary[0].id;
            }

            loadPDFById(activeFileId, false);
            renderSavedLibrary();
        });

        function extractDriveId(input) {
            const trimmed = input.trim();
            if (!trimmed) return null;

            const fileMatch = trimmed.match(/\/d\/([a-zA-Z0-9_-]{15,})/);
            if (fileMatch && fileMatch[1]) return fileMatch[1];

            const idParamMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
            if (idParamMatch && idParamMatch[1]) return idParamMatch[1];

            if (/^[a-zA-Z0-9_-]{20,}$/.test(trimmed)) return trimmed;

            return null;
        }

        function saveQuickLink() {
            const inputEl = document.getElementById('quickUrlInput');
            const rawUrl = inputEl.value;
            const fileId = extractDriveId(rawUrl);

            if (!fileId) {
                showToast('Please paste a valid PDF link!', true);
                return;
            }

            const title = `Document #${savedLibrary.length + 1}`;
            ensureInLibrary(fileId, title);
            loadPDFById(fileId, true);
            inputEl.value = '';
        }

        function addAndSavePDF() {
            const titleEl = document.getElementById('pdfTitleInput');
            const urlEl = document.getElementById('pdfUrlInput');

            const fileId = extractDriveId(urlEl.value);
            if (!fileId) {
                showToast('Invalid PDF link!', true);
                return;
            }

            const title = titleEl.value.trim() || `Saved PDF #${savedLibrary.length + 1}`;
            ensureInLibrary(fileId, title);
            loadPDFById(fileId, true);

            titleEl.value = '';
            urlEl.value = '';
        }

        function ensureInLibrary(fileId, title) {
            const existingIndex = savedLibrary.findIndex(item => item.id === fileId);
            if (existingIndex > -1) {
                if (title && title !== 'Shared Document') {
                    savedLibrary[existingIndex].title = title;
                }
            } else {
                savedLibrary.unshift({
                    id: fileId,
                    title: title,
                    addedAt: new Date().toLocaleDateString()
                });
            }
            localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(savedLibrary));
            renderSavedLibrary();
        }

        function loadPDFById(fileId, showNotification = true) {
            activeFileId = fileId;
            localStorage.setItem(STORAGE_KEY_ACTIVE, fileId);

            const item = savedLibrary.find(i => i.id === fileId);
            const docTitle = item ? item.title : 'Custom PDF';

            document.getElementById('loader').classList.remove('hidden');

            pdfFrame.src = `https://drive.google.com/file/d/${fileId}/preview`;
            document.getElementById('downloadBtn').href = `https://drive.google.com/uc?export=download&id=${fileId}`;
            document.getElementById('docTitleDisplay').innerText = docTitle;
            document.title = `${docTitle} - PDF Studio Pro`;

            renderSavedLibrary();
            if (showNotification) {
                showToast(`"${docTitle}" loaded & saved permanently!`);
            }
        }

        function renderSavedLibrary() {
            const container = document.getElementById('savedListContainer');
            document.getElementById('savedCount').innerText = savedLibrary.length;
            container.innerHTML = '';

            savedLibrary.forEach(item => {
                const div = document.createElement('div');
                div.className = `saved-item ${item.id === activeFileId ? 'active' : ''}`;
                div.onclick = () => loadPDFById(item.id, true);

                div.innerHTML = `
                    <div class="saved-item-info">
                        <div class="saved-item-title">${escapeHtml(item.title)}</div>
                        <div class="saved-item-id">ID: ${item.id.substring(0, 14)}... • ${item.addedAt}</div>
                    </div>
                    <div class="saved-item-actions">
                        <button class="icon-btn" onclick="copyShareUrl(event, '${item.id}')" title="Copy Shareable Link">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                        ${savedLibrary.length > 1 ? `
                        <button class="icon-btn delete" onclick="deleteSavedPDF(event, '${item.id}')" title="Remove from Saved">
                            <i class="fa-solid fa-trash"></i>
                        </button>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteSavedPDF(event, fileId) {
            event.stopPropagation();
            savedLibrary = savedLibrary.filter(item => item.id !== fileId);
            localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(savedLibrary));

            if (activeFileId === fileId && savedLibrary.length > 0) {
                loadPDFById(savedLibrary[0].id, false);
            }
            renderSavedLibrary();
            showToast('Removed from saved library');
        }

        function copyShareUrl(event, fileId) {
            event.stopPropagation();
            const shareUrl = `${window.location.origin}${window.location.pathname}?id=${fileId}`;
            navigator.clipboard.writeText(shareUrl);
            showToast('Shareable direct link copied!');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toastMsg.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // ================= VIEWER CONTROLS =================
        function hideLoader() {
            document.getElementById('loader').classList.add('hidden');
        }

        function toggleToolbar() {
            topToolbar.classList.toggle('collapsed');
            expandToolbarBtn.classList.toggle('visible');
        }

        function toggleMinimizePDF() {
            pdfCard.classList.toggle('minimized');
            const btn = document.getElementById('minimizeBtn');
            if (pdfCard.classList.contains('minimized')) {
                btn.innerHTML = '<i class="fa-solid fa-expand"></i> <span>Expand</span>';
                btn.classList.add('active');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-compress"></i> <span>Collapse</span>';
                btn.classList.remove('active');
            }
        }

        function toggleEdgeToEdge() {
            workspace.classList.toggle('edge-to-edge');
            document.getElementById('edgeBtn').classList.toggle('active');
        }

        function rotatePDF() {
            currentRotation = (currentRotation + 90) % 360;
            pdfFrame.style.transform = `rotate(${currentRotation}deg)`;
        }

        function toggleDrawer(drawerId) {
            const drawers = ['libraryDrawer', 'displayDrawer', 'notesDrawer'];
            drawers.forEach(id => {
                const el = document.getElementById(id);
                if (id === drawerId) {
                    el.classList.toggle('open');
                } else {
                    el.classList.remove('open');
                }
            });
        }

        function updateWidth(val) {
            document.documentElement.style.setProperty('--viewer-width', val + '%');
            document.getElementById('widthVal').innerText = val + '%';
        }

        function applyFilters() {
            const b = document.getElementById('brightSlider').value;
            const c = document.getElementById('contrastSlider').value;
            const s = document.getElementById('sepiaSlider').value;

            document.getElementById('brightVal').innerText = b + '%';
            document.getElementById('contrastVal').innerText = c + '%';
            document.getElementById('sepiaVal').innerText = s + '%';

            const invertFilter = isInverted ? 'invert(0.9) hue-rotate(180deg)' : '';
            pdfFrame.style.filter = `brightness(${b}%) contrast(${c}%) sepia(${s}%) ${invertFilter}`;
        }

        function toggleInvert() {
            isInverted = !isInverted;
            applyFilters();
        }

        function resetFilters() {
            isInverted = false;
            currentRotation = 0;
            pdfFrame.style.transform = 'rotate(0deg)';
            document.getElementById('brightSlider').value = 100;
            document.getElementById('contrastSlider').value = 100;
            document.getElementById('sepiaSlider').value = 0;
            updateWidth(92);
            applyFilters();
        }

        function toggleFullScreen() {
            const icon = document.getElementById('fsIcon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                icon.classList.replace('fa-expand', 'fa-compress');
            } else {
                document.exitFullscreen();
                icon.classList.replace('fa-compress', 'fa-expand');
            }
        }

        // Auto-save & Download Notes
        notesInput.value = localStorage.getItem('pdf_reader_notes') || '';
        notesInput.addEventListener('input', () => {
            localStorage.setItem('pdf_reader_notes', notesInput.value);
        });

        function downloadNotes() {
            const blob = new Blob([notesInput.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'PDF-Reading-Notes.txt';
            a.click();
        }

        function clearNotes() {
            if (confirm('Clear all saved notes?')) {
                notesInput.value = '';
                localStorage.removeItem('pdf_reader_notes');
            }
        }
    </script>
</body>
</html>
