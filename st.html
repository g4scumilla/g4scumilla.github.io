<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical PDF Reader Pro</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Import Map for Firebase -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
        }
    }
    </script>

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a 50%, #020617);
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --viewer-width: 94%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ================= TOP COLLAPSIBLE CONTROL BAR (PDF) ================= */
        .top-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 99;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90px;
            opacity: 1;
            gap: 10px;
            flex-shrink: 0;
        }

        .top-toolbar.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom: none;
            opacity: 0;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.92rem;
            white-space: nowrap;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }

        /* Quick Link Input Bar */
        .quick-input-bar {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 4px 4px 4px 12px;
            flex: 1;
            max-width: 340px;
            transition: border-color 0.2s;
        }

        .quick-input-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
        }

        .quick-input-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.8rem;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .quick-input-bar input::placeholder {
            color: var(--text-muted);
        }

        /* Dedicated Smooth Zoom Pill */
        .zoom-toolbar-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--glass-border);
            padding: 4px 8px;
            border-radius: 10px;
        }

        .zoom-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid transparent;
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.15s ease;
        }

        .zoom-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        .zoom-slider-inline {
            width: 85px;
            accent-color: var(--accent);
            cursor: pointer;
            height: 4px;
        }

        .zoom-badge {
            font-size: 0.78rem;
            font-weight: 600;
            color: #e2e8f0;
            min-width: 46px;
            text-align: center;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(99, 102, 241, 0.18);
            border: 1px solid rgba(99, 102, 241, 0.35);
            transition: all 0.2s;
        }

        .zoom-badge:hover {
            background: var(--accent);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 11px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn.active, .btn-primary {
            background: var(--accent);
            border-color: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.76rem;
            border-radius: 7px;
        }

        /* Floating Expand/Collapse Pill Button */
        .toolbar-toggle-pill {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            z-index: 150;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toolbar-toggle-pill.visible {
            transform: translateX(-50%) translateY(0);
        }

        .toolbar-toggle-pill:hover {
            background: var(--accent);
        }

        /* ================= FLOATING BOTTOM ZOOM DOCK ================= */
        .floating-zoom-dock {
            position: fixed;
            bottom: 20px;
            right: 24px;
            z-index: 130;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 7px 12px;
            border-radius: 999px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .floating-zoom-dock.minimized .dock-controls {
            display: none;
        }

        .dock-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ================= MAIN CONTENT AREA ================= */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            padding: 12px;
            transition: padding 0.3s ease;
        }

        .workspace.edge-to-edge {
            padding: 0;
        }

        .pdf-card {
            width: var(--viewer-width);
            height: 100%;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, height 0.35s ease, border-radius 0.3s ease;
        }

        .workspace.edge-to-edge .pdf-card {
            width: 100% !important;
            border-radius: 0;
            border: none;
        }

        .pdf-card.minimized {
            height: 46px !important;
            width: 480px !important;
            border-radius: 14px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 18px;
            background: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .window-dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .dot:hover { transform: scale(1.2); }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: #10b981; }
        .dot.purple { background: #6366f1; }

        /* Smooth Scrollable Zoom Viewport */
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            background: #0f172a;
            scroll-behavior: auto;
        }

        .iframe-wrapper::-webkit-scrollbar {
            height: 10px;
        }
        .iframe-wrapper::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .iframe-wrapper::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 5px;
        }
        .iframe-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .zoom-stage {
            width: 100%;
            height: 100%;
            position: relative;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            transition: filter 0.25s ease;
        }

        /* Loading Spinner */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ================= COLLAPSIBLE SIDE DRAWERS ================= */
        .side-drawer {
            position: fixed;
            top: 170px;
            right: 20px;
            width: 350px;
            max-height: calc(100vh - 195px);
            overflow-y: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            z-index: 140;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .side-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .text-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 9px 12px;
            font-size: 0.83rem;
            font-family: inherit;
            outline: none;
        }

        .text-input:focus {
            border-color: var(--accent);
        }

        /* Saved PDF Library List */
        .saved-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .saved-item:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(30, 41, 59, 0.9);
        }

        .saved-item.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
        }

        .saved-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            flex: 1;
            margin-right: 8px;
        }

        .saved-item-title {
            font-size: 0.83rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-item-id {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.15);
        }

        .control-row {
            margin-bottom: 15px;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .notes-area {
            width: 100%;
            height: 220px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            resize: none;
            outline: none;
            margin-bottom: 12px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: #fff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            z-index: 200;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 1150px) {
            .quick-input-bar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .top-toolbar {
                padding: 8px 10px;
                flex-direction: column;
                max-height: 160px;
            }
            .workspace {
                padding: 4px;
            }
            :root {
                --viewer-width: 100%;
            }
            .btn span {
                display: none;
            }
            .side-drawer {
                width: calc(100vw - 24px);
                right: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Pill to Expand Toolbar When Collapsed -->
    <button class="toolbar-toggle-pill" id="expandToolbarBtn" onclick="toggleToolbar()">
        <i class="fa-solid fa-sliders"></i> Show Controls
    </button>

    <!-- Floating Bottom-Right Collapsible Zoom Dock -->
    <div class="floating-zoom-dock" id="floatingZoomDock">
        <button class="zoom-btn" onclick="toggleZoomDock()" title="Collapse/Expand Zoom Bar">
            <i class="fa-solid fa-magnifying-glass" id="dockToggleIcon"></i>
        </button>
        <div class="dock-controls">
            <button class="zoom-btn" onclick="stepZoom(-15)" title="Zoom Out (-)">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span class="zoom-badge" id="dockZoomBadge" onclick="animateZoomTo(100)" title="Click to Reset to 100%">100%</span>
            <button class="zoom-btn" onclick="stepZoom(15)" title="Zoom In (+)">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">PDF Saved Permanently!</span>
    </div>

    <div class="app-wrapper">

        <!-- ================= EXTERNAL HEADER INJECTION ================= -->
        <div id="header-placeholder"></div>

        <!-- Collapsible Top Control Bar (PDF Specific) -->
        <div class="top-toolbar" id="topToolbar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-book-open-reader" style="color: white;"></i>
                </div>
                <div style="line-height: 1.1;">
                    <div>PDF Studio Pro</div>
                    <small style="color: var(--text-muted); font-size: 0.7rem;">Smooth Zoom Reader</small>
                </div>
            </div>

            <!-- Instant Link Paste Bar -->
            <div class="quick-input-bar">
                <i class="fa-solid fa-link" style="color: var(--accent-hover); margin-right: 8px;"></i>
                <input type="text" id="quickUrlInput" placeholder="Paste PDF link & press Save..." onkeydown="if(event.key==='Enter') saveQuickLink()">
                <button class="btn btn-primary btn-sm" onclick="saveQuickLink()">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                </button>
            </div>

            <!-- Dedicated Smooth Zoom Bar in Header -->
            <div class="zoom-toolbar-pill">
                <button class="zoom-btn" onclick="stepZoom(-15)" title="Smooth Zoom Out (Ctrl + -)">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>
                <input type="range" class="zoom-slider-inline" id="topZoomSlider" min="50" max="250" value="100" oninput="setZoomImmediate(this.value)" title="Smooth Zoom Slider">
                <span class="zoom-badge" id="topZoomBadge" onclick="animateZoomTo(100)" title="Click to Reset Zoom (100%)">100%</span>
                <button class="zoom-btn" onclick="stepZoom(15)" title="Smooth Zoom In (Ctrl + +)">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
            </div>

            <div class="controls-group">
                <!-- Saved PDF Library & Link Manager Drawer -->
                <button class="btn btn-primary" onclick="toggleDrawer('libraryDrawer')" id="libraryBtn" title="Add or Switch Saved PDFs">
                    <i class="fa-solid fa-folder-plus"></i> <span>Saved PDFs</span>
                </button>

                <!-- Collapse/Expand PDF Card -->
                <button class="btn" onclick="toggleMinimizePDF()" id="minimizeBtn" title="Collapse or Expand PDF Viewer">
                    <i class="fa-solid fa-compress"></i> <span>Collapse</span>
                </button>

                <!-- Width / Cinema Toggle -->
                <button class="btn" onclick="toggleEdgeToEdge()" id="edgeBtn" title="Toggle Cinema Full-Width">
                    <i class="fa-solid fa-arrows-left-right"></i> <span>Cinema</span>
                </button>

                <!-- Rotate Page -->
                <button class="btn" onclick="rotatePDF()" title="Rotate Viewer 90°">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>

                <!-- Eye Care & Display Controls Drawer -->
                <button class="btn" onclick="toggleDrawer('displayDrawer')" id="displayBtn" title="Zoom Presets & Eye Care Filters">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Filters</span>
                </button>

                <!-- Quick Notes Drawer -->
                <button class="btn" onclick="toggleDrawer('notesDrawer')" id="notesBtn" title="Take Reading Notes">
                    <i class="fa-solid fa-pen-to-square"></i> <span>Notes</span>
                </button>

                <!-- Direct Download -->
                <a class="btn" id="downloadBtn"
                   href="https://drive.google.com/uc?export=download&id=1iLYBo1YToYSTlSqt8cYDyIwOk0V9yZbt" 
                   target="_blank" 
                   title="Download Current PDF">
                    <i class="fa-solid fa-download"></i>
                </a>

                <!-- Fullscreen -->
                <button class="btn" onclick="toggleFullScreen()" title="Fullscreen Mode">
                    <i class="fa-solid fa-expand" id="fsIcon"></i>
                </button>

                <!-- Collapse Top Bar -->
                <button class="btn" onclick="toggleToolbar()" title="Hide Toolbar">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="workspace" id="workspace">
            <div class="pdf-card" id="pdfCard">
                <!-- Mini Window Header -->
                <div class="card-header">
                    <div class="window-dots">
                        <div class="dot yellow" onclick="toggleMinimizePDF()" title="Collapse/Expand PDF"></div>
                        <div class="dot green" onclick="toggleEdgeToEdge()" title="Expand Width"></div>
                        <div class="dot purple" onclick="toggleToolbar()" title="Toggle Top Controls"></div>
                        <span id="docTitleDisplay" style="margin-left: 8px; font-weight: 600; color: #e2e8f0;">Default Document</span>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">
                        <span id="headerZoomReadout">Zoom: 100%</span>
                    </div>
                </div>

                <!-- PDF Embed Container with Dynamic Zoom Stage -->
                <div class="iframe-wrapper" id="iframeWrapper">
                    <div class="loader-overlay" id="loader">
                        <div class="spinner"></div>
                        <span style="font-size: 0.9rem; color: var(--text-muted);">Loading your PDF preview...</span>
                    </div>

                    <div class="zoom-stage" id="zoomStage">
                        <iframe 
                            id="pdfFrame"
                            src="" 
                            allow="autoplay"
                            onload="hideLoader()"
                            title="PDF Document Viewer">
                        </iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= 1. PERMANENT PDF LIBRARY & LINK INPUT DRAWER ================= -->
    <aside class="side-drawer" id="libraryDrawer">
        <div class="drawer-header">
            <span><i class="fa-solid fa-bookmark" style="color: var(--accent);"></i> Add & Save PDF Link</span>
            <button class="btn btn-sm" onclick="toggleDrawer('libraryDrawer')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="input-group">
            <label>PDF Name / Title (Optional)</label>
            <input type="text" class="text-input" id="pdfTitleInput" placeholder="e.g., Chapter 1 Study Guide">
        </div>

        <div class="input-group">
            <label>PDF Link (or File ID)</label>
            <input type="text" class="text-input" id="pdfUrlInput" placeholder="https://drive.google.com/file/d/.../view">
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 16px;" onclick="addAndSavePDF()">
            <i class="fa-solid fa-floppy-disk"></i> Preview & Save Permanently
        </button>

        <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); padding-bottom: 6px;">
            Permanently Saved PDFs (<span id="savedCount">1</span>)
        </div>

        <div class="saved-list" id="savedListContainer"></div>
    </aside>

    <!-- ================= 2. ZOOM PRESETS & EYE-CARE DRAWER ================= -->
    <aside class="side-drawer" id="displayDrawer">
        <div class="drawer-header">
            <span><i class="fa-solid fa-sliders" style="color: var(--accent);"></i> Zoom & Reading Comfort</span>
            <button class="btn btn-sm" onclick="toggleDrawer('displayDrawer')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="control-row">
            <label><span>Smooth PDF Zoom</span> <span id="drawerZoomVal">100%</span></label>
            <input type="range" id="drawerZoomSlider" min="50" max="250" value="100" oninput="setZoomImmediate(this.value)">
        </div>

        <!-- Instant Smooth Zoom Presets -->
        <div class="preset-grid">
            <button class="btn btn-sm" style="justify-content:center;" onclick="animateZoomTo(75)">75%</button>
            <button class="btn btn-sm" style="justify-content:center;" onclick="animateZoomTo(100)">100%</button>
            <button class="btn btn-sm" style="justify-content:center;" onclick="animateZoomTo(125)">125%</button>
            <button class="btn btn-sm" style="justify-content:center;" onclick="animateZoomTo(150)">150%</button>
            <button class="btn btn-sm" style="justify-content:center;" onclick="animateZoomTo(175)">175%</button>
            <button class="btn btn-sm" style="justify-content:center;" onclick="animateZoomTo(200)">200%</button>
        </div>

        <div class="control-row">
            <label><span>Viewer Card Width</span> <span id="widthVal">94%</span></label>
            <input type="range" id="widthSlider" min="50" max="100" value="94" oninput="updateWidth(this.value)">
        </div>

        <div class="control-row">
            <label><span>Brightness</span> <span id="brightVal">100%</span></label>
            <input type="range" id="brightSlider" min="50" max="130" value="100" oninput="applyFilters()">
        </div>

        <div class="control-row">
            <label><span>Contrast</span> <span id="contrastVal">100%</span></label>
            <input type="range" id="contrastSlider" min="70" max="150" value="100" oninput="applyFilters()">
        </div>

        <div class="control-row">
            <label><span>Warm Sepia (Eye Care)</span> <span id="sepiaVal">0%</span></label>
            <input type="range" id="sepiaSlider" min="0" max="80" value="0" oninput="applyFilters()">
        </div>

        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="btn" style="flex: 1; justify-content: center;" onclick="toggleInvert()">
                <i class="fa-solid fa-moon"></i> Invert Dark
            </button>
            <button class="btn" style="flex: 1; justify-content: center;" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i> Reset All
            </button>
        </div>
    </aside>

    <!-- ================= 3. QUICK NOTES DRAWER ================= -->
    <aside class="side-drawer" id="notesDrawer">
        <div class="drawer-header">
            <span><i class="fa-solid fa-pen-nib" style="color: var(--accent);"></i> Quick Reading Notes</span>
            <button class="btn btn-sm" onclick="toggleDrawer('notesDrawer')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <textarea class="notes-area" id="notesInput" placeholder="Write key takeaways while reading... (Auto-saved permanently in browser)"></textarea>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-primary" style="flex: 1; justify-content: center;" onclick="downloadNotes()">
                <i class="fa-solid fa-file-arrow-down"></i> Save .txt
            </button>
            <button class="btn" onclick="clearNotes()" title="Clear Notes">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
    </aside>

    <!-- ==================== EXTERNAL FOOTER INJECTION ==================== -->
    <div id="footer-placeholder"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
