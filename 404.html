<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>404 - Page Not Found</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8b0000">

<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root { 
    --g4s-red: #8b0000; 
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; user-select: none; }

body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    padding-bottom: calc(85px + var(--safe-bottom));
    background: linear-gradient(rgba(248, 249, 250, 0.98), rgba(248, 249, 250, 0.98)), 
                url('https://www.transparenttextures.com/patterns/floral-paper.png');
    background-size: auto;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Container spacing for injected header */
#header-placeholder {
    width: 100%;
    z-index: 100;
}

.card-container { 
    padding: 0 15px 10px; 
    position: relative;
    z-index: 10;
}

.visa-card {
    border-radius: 15px; aspect-ratio: 1.58 / 1; width: 100%;
    color: white; display: flex; flex-direction: column;
    box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
    background: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1400&q=80');
    background-size: cover;
}

.visa-card::before {
    content: ""; position: absolute; inset: 0; width: 100%;
    background: url('https://g4scumilla.github.io/Files/Img/logo.png');
    background-size: 35%; background-repeat: no-repeat; background-position: 15px center; 
    opacity: 0.85; z-index: 1;
    mask-image: linear-gradient(to right, black 30%, transparent 80%);
    -webkit-mask-image: linear-gradient(to right, black 30%, transparent 80%);
}

.visa-card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(139, 0, 0, 0.5));
    z-index: 2;
}

.visa-card > * { position: relative; z-index: 3; }

.error-section {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
    background: radial-gradient(circle at center, rgba(139, 0, 0, 0.08) 0%, transparent 70%);
}

.error-section h1 { font-family: 'Lobster', cursive; font-size: 110px; color: var(--g4s-red); margin: 0; line-height: 1; text-shadow: 2px 4px 10px rgba(0,0,0,0.1); }
.error-section p { font-size: 18px; font-weight: 800; color: #444; margin-top: -5px; margin-bottom: 30px; letter-spacing: 2px; }

.action-btn {
    text-decoration: none; width: 280px; padding: 14px; margin: 6px 0;
    background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 15px;
    font-size: 15px; font-weight: 800; color: var(--g4s-red);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); border: 1px solid rgba(139, 0, 0, 0.1); transition: all 0.2s ease;
}

.btn-back { background: var(--g4s-red); color: #fff; }
.action-btn i { font-size: 18px; }
.action-btn:active { transform: scale(0.95); opacity: 0.9; }

.rotating { animation: rotate 1s linear; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

@media (min-width: 768px) {
    body { margin: 0 auto; max-width: 440px; }
}
</style>
</head>

<body>

<!-- HEADER INJECTION POINT -->
<div id="header-placeholder"></div>

<div class="card-container">
    <div class="visa-card">
        <div style="flex:1; display:flex; padding: 20px; position: relative;">
            <div style="flex: 0.42;"></div>
            <div style="flex: 0.58; display: flex; flex-direction: column; justify-content: center; text-align: left; padding-left: 15px; border-left: 2px solid rgba(255,255,255,0.3);">
                <div style="margin-bottom: 12px;">
                    <div style="font-family: 'Lobster', cursive; font-size: 20px; color: #fff; letter-spacing: 0.5px; border-bottom: 2px solid var(--g4s-red); display: inline-block; padding-bottom: 2px;">Welcome to G4S</div>
                    <div style="font-size: 8px; font-weight: 700; color: rgba(255,255,255,0.95); margin-top: 4px; border-bottom: 1px solid rgba(255,255,255,0.4); display: inline-block;">Productivity & Automation</div>
                </div>
                <div>
                    <div style="font-family: 'Lobster', cursive; font-size: 14px; color: #ffeb3b; letter-spacing: 0.5px;">Secure Access</div>
                    <div style="font-size: 7px; font-weight: 600; opacity: 0.9; line-height: 1.4; margin-top: 2px;">Professional internal resource hub.</div>
                </div>
            </div>
        </div>
        <div style="padding:10px 15px; background: rgba(0,0,0,0.4); font-size: 8px; text-align: left; letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center; font-weight: 800;">
            <span style="font-family: 'Lobster', cursive; font-size: 11px; text-transform: none; letter-spacing: 0.5px;"><i class="fa-solid fa-code"></i> Developed By: Abdullahil Kuafi</span>
            <span id="live-clock" style="background: rgba(255,255,255,0.15); padding: 3px 12px; border-radius: 5px; font-family: 'Lobster', cursive; font-size: 10px; font-weight: bold; letter-spacing: 0.8px;">--:--:-- --</span>
        </div>
    </div>
</div>

<div class="error-section">
    <h1>404</h1>
    <p>LOCATION NOT FOUND</p>

    <a href="javascript:void(0)" onclick="history.back()" class="action-btn btn-back">
        <i class="fa-solid fa-arrow-left"></i> 
        <span>Go Back</span>
    </a>

    <a href="index.html" class="action-btn">
        <i class="fa-solid fa-house-chimney"></i> 
        <span>Home Dashboard</span>
    </a>

    <a href="https://kaficumilla.shop/Projects/mydashboard/index" class="action-btn">
        <i class="fa-solid fa-user-shield"></i> 
        <span>Developer Portal</span>
    </a>

    <a href="javascript:void(0)" class="action-btn" onclick="syncPage(this)">
        <i class="fa-solid fa-arrows-rotate" id="sync-icon"></i> 
        <span>Refresh & Sync</span>
    </a>
</div>

<!-- FOOTER INJECTION POINT -->
<div id="footer-placeholder"></div>

<script>
    // --- Dynamic Component Injection ---
    // Fetches your existing header and footer files and loads them into the placeholders above.
    fetch('header.html')
        .then(response => response.text())
        .then(data => document.getElementById('header-placeholder').innerHTML = data)
        .catch(error => console.error('Error loading header:', error));

    fetch('footer.html')
        .then(response => response.text())
        .then(data => document.getElementById('footer-placeholder').innerHTML = data)
        .catch(error => console.error('Error loading footer:', error));

    // --- Clock Script ---
    function updateClock() {
        const now = new Date();
        const clockEl = document.getElementById('live-clock');
        if(clockEl) {
            clockEl.innerText = now.toLocaleTimeString([], { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            });
        }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Sync Script ---
    function syncPage(el) {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('rotating');
        setTimeout(() => {
            location.reload();
        }, 800);
    }
</script>

</body>
</html>
