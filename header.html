<header class="app-global-header">
    <div class="header-main-row">
        <div class="header-left-group">
            <img src="https://G4scumilla.github.io/Files/Img/IMG_20260426_004707.png" 
                 alt="Abdullahil Kuafi" 
                 class="android-header-avatar"
                 onerror="this.src='https://ui-avatars.com/api/?name=Abdullahil+Kuafi&background=3ded97&color=0b0f19&size=64'">
            <span class="android-header-title"><a href="index" style="color: inherit; text-decoration: none;">Abdullahil Kuafi</a></span>
        </div>
        <div class="header-actions-right">
            <span class="live-sync-indicator" title="Auto Cloud Sync Every 4.5s">
                <span class="sync-dot" id="live-sync-dot"></span>
                <span id="live-sync-text">Live</span>
            </span>
            <div class="header-search-container" id="header-search-container">
                <input type="text" id="search-input" class="header-search-input" placeholder="Search apps..." oninput="handleSearch(this.value)">
            </div>
            <button class="header-icon-btn" onclick="toggleHeaderSearch()" title="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </div>

    <div class="header-notice-row" id="home-notice-showcase" onclick="switchPage('notices')">
        <div class="notice-update-label">
            <span class="pulse-dot"></span> Update:
        </div>
        <div class="notice-marquee-container">
            <marquee behavior="scroll" direction="left" scrollamount="4" id="home-notice-text" class="notice-marquee-text">
                Welcome to Abdullahil Kuafi's Smart Cloud Hub!
            </marquee>
        </div>
    </div>
</header>
