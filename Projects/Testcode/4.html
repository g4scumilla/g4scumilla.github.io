<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4S Vault & Cash Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-950 via-slate-900 to-teal-950 min-h-screen text-slate-100 p-4 sm:p-8 relative overflow-x-hidden">

    <!-- Ambient Background Lighting -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="max-w-4xl mx-auto">
        <!-- Dashboard Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 flex items-center gap-2 justify-center text-emerald-400">
                    <i class="fa-solid fa-vault text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-tight">G4S Financial Vault</h1>
                    <p class="text-xs font-semibold text-emerald-400/80">Active Cash Account Overview</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <label for="currency-select" class="text-xs font-bold text-slate-400 uppercase hidden sm:block">Currency:</label>
                <select id="currency-select" class="bg-slate-800/80 text-xs font-bold text-emerald-300 border border-emerald-500/30 rounded-xl px-3 py-2 outline-none focus:border-emerald-400 transition-all backdrop-blur-md">
                    <option value="BDT" selected>BDT (৳)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                </select>
            </div>
        </header>

        <!-- MERGED DUAL CARD SECTION -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

            <!-- Card Option 1: Premium Emerald & Gold -->
            <div class="w-full bg-gradient-to-br from-emerald-900 via-teal-900 to-slate-950 rounded-[28px] p-6 shadow-2xl relative overflow-hidden text-white border border-emerald-500/30 backdrop-blur-xl">
                <!-- Ambient Decorative Glows -->
                <div class="absolute -right-8 -top-8 w-32 h-32 bg-emerald-400/20 rounded-full blur-2xl"></div>
                <div class="absolute -left-8 -bottom-8 w-36 h-36 bg-amber-400/15 rounded-full blur-2xl"></div>
                
                <div class="flex justify-between items-center mb-4 relative z-10">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
                        <span class="text-[9px] font-black tracking-widest text-emerald-200 uppercase">Main Cash Account</span>
                    </div>
                    <span class="text-[8px] font-black bg-emerald-500/20 px-2.5 py-1 rounded-full text-emerald-300 border border-emerald-400/30 uppercase tracking-wider backdrop-blur-md">Vault Active</span>
                </div>

                <div class="my-3 text-center relative z-10">
                    <p class="text-[9px] font-extrabold text-emerald-300/80 uppercase tracking-widest mb-1">Available Balance</p>
                    <h2 class="text-3xl font-black tracking-tight text-white drop-shadow-md" id="cb-display">0.00</h2>
                </div>

                <div class="mt-5 flex justify-between items-center pt-3 border-t border-emerald-500/20 text-[9px] relative z-10">
                    <div class="flex items-center gap-1.5 text-emerald-200/70 font-bold uppercase">
                        <i class="fa-solid fa-shield-halved text-emerald-400 text-xs"></i>
                        <span>Secure Account</span>
                    </div>
                    <p class="font-bold text-emerald-200/80">Currency: <span id="card-curr-label" class="text-amber-300 font-black">BDT</span></p>
                </div>
            </div>

            <!-- Card Option 2: Frosted Cyan & Glass -->
            <div class="w-full bg-gradient-to-br from-white/90 via-emerald-50/80 to-teal-100/90 rounded-[28px] p-6 shadow-xl relative overflow-hidden text-slate-800 border border-white/80 backdrop-blur-2xl">
                <!-- Ambient Decorative Glows -->
                <div class="absolute -right-6 -top-6 w-28 h-28 bg-teal-400/20 rounded-full blur-xl"></div>
                <div class="absolute -left-6 -bottom-6 w-28 h-28 bg-emerald-500/20 rounded-full blur-xl"></div>

                <div class="flex justify-between items-center mb-4 relative z-10">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-teal-500 animate-pulse shadow-[0_0_8px_rgba(20,184,166,0.6)]"></span>
                        <span class="text-[9px] font-black tracking-widest text-teal-800 uppercase">Main Cash Account</span>
                    </div>
                    <span class="text-[8px] font-bold bg-teal-600 text-white px-2.5 py-0.5 rounded-full uppercase tracking-wider shadow-sm">Active</span>
                </div>

                <div class="my-3 text-center relative z-10">
                    <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Available Balance</p>
                    <h2 class="text-3xl font-black tracking-tight text-slate-900" id="cb-display-2">0.00</h2>
                </div>

                <div class="mt-4 flex justify-between items-center pt-3 border-t border-slate-200/80 text-[9px] relative z-10">
                    <span class="font-bold text-slate-500 uppercase flex items-center gap-1">
                        <i class="fa-solid fa-lock text-teal-600"></i> Vault Protected
                    </span>
                    <p class="font-bold text-slate-600">Currency: <span id="card-curr-label-2" class="text-teal-700 font-black">BDT</span></p>
                </div>
            </div>

        </div>

        <!-- Interactive Quick Actions & Deposit Panel -->
        <section class="bg-slate-900/60 border border-slate-800 rounded-[28px] p-6 backdrop-blur-md mb-8">
            <h3 class="text-sm font-extrabold text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-emerald-400"></i> Quick Actions
            </h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2">Amount</label>
                    <div class="relative">
                        <input type="number" id="amount-input" placeholder="Enter amount..." class="w-full bg-slate-800/90 border border-slate-700 rounded-2xl px-4 py-3 text-sm font-bold text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400 transition-all">
                    </div>
                </div>

                <div class="flex gap-3 items-end">
                    <button id="btn-deposit" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold text-xs uppercase tracking-wider py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-900/30 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Deposit
                    </button>
                    <button id="btn-withdraw" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-rose-400 font-extrabold text-xs uppercase tracking-wider py-3.5 px-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-minus"></i> Withdraw
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript to keep both cards synchronized -->
    <script>
        let currentBalance = 0.00;

        const cbDisplay1 = document.getElementById('cb-display');
        const cbDisplay2 = document.getElementById('cb-display-2');
        const cardCurrLabel1 = document.getElementById('card-curr-label');
        const cardCurrLabel2 = document.getElementById('card-curr-label-2');
        const currencySelect = document.getElementById('currency-select');
        const amountInput = document.getElementById('amount-input');
        const btnDeposit = document.getElementById('btn-deposit');
        const btnWithdraw = document.getElementById('btn-withdraw');

        function updateBalanceDisplays() {
            const formatted = currentBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            if (cbDisplay1) cbDisplay1.textContent = formatted;
            if (cbDisplay2) cbDisplay2.textContent = formatted;
        }

        function updateCurrencyDisplays(curr) {
            if (cardCurrLabel1) cardCurrLabel1.textContent = curr;
            if (cardCurrLabel2) cardCurrLabel2.textContent = curr;
        }

        currencySelect.addEventListener('change', (e) => {
            updateCurrencyDisplays(e.target.value);
        });

        btnDeposit.addEventListener('click', () => {
            const val = parseFloat(amountInput.value);
            if (!isNaN(val) && val > 0) {
                currentBalance += val;
                updateBalanceDisplays();
                amountInput.value = '';
            }
        });

        btnWithdraw.addEventListener('click', () => {
            const val = parseFloat(amountInput.value);
            if (!isNaN(val) && val > 0) {
                if (val <= currentBalance) {
                    currentBalance -= val;
                    updateBalanceDisplays();
                    amountInput.value = '';
                } else {
                    alert('Insufficient balance!');
                }
            }
        });

        // Initial setup
        updateBalanceDisplays();
    </script>
</body>
</html>
